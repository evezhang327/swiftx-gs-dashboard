<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GS 时效监控台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101823;
    --ink-soft: #47525f;
    --surface: #f4f6f8;
    --surface-raised: #ffffff;
    --surface-sunken: #e8ebee;
    --border: #d7dce1;
    --border-soft: #e4e8eb;
    --accent: #2d6a86;
    --accent-soft: #e5eef1;
    --accent-ink: #1c4a5f;
    --good: #3f7d58;
    --good-soft: #e6f1ea;
    --warn: #a97327;
    --warn-soft: #f6ecdb;
    --crit: #b0402a;
    --crit-soft: #f8e6e1;
    --crit-strong: #8c3120;
    --shadow: 0 1px 2px rgba(16, 24, 35, 0.06), 0 8px 24px -12px rgba(16, 24, 35, 0.12);
    /* ⑥ 分区域周趋势：5 槽分类色板（dataviz skill 默认色板前 5 槽，浅色模式，
       已跑过 validate_palette.js 校验：全部通过，3 个槽位对比度 <3:1 落在
       WARN 区间，靠图例文字/表格视图兜底，不能只靠颜色本身分辨）。 */
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e9edf1;
      --ink-soft: #a3aebb;
      --surface: #0e141c;
      --surface-raised: #161f2a;
      --surface-sunken: #0a0f16;
      --border: #2a3542;
      --border-soft: #202a35;
      --accent: #6fb2cc;
      --accent-soft: #16303a;
      --accent-ink: #a9d9ea;
      --good: #6cbf8e;
      --good-soft: #142b1e;
      --warn: #d9a84f;
      --warn-soft: #2e2410;
      --crit: #e2725a;
      --crit-soft: #331611;
      --crit-strong: #f19277;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.5);
      /* 深色模式同一组 5 槽色板的深色台阶（dataviz skill 默认色板），已用
         validate_palette.js 对 --surface-raised 的深色值校验过：全部通过。 */
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e9edf1;
    --ink-soft: #a3aebb;
    --surface: #0e141c;
    --surface-raised: #161f2a;
    --surface-sunken: #0a0f16;
    --border: #2a3542;
    --border-soft: #202a35;
    --accent: #6fb2cc;
    --accent-soft: #16303a;
    --accent-ink: #a9d9ea;
    --good: #6cbf8e;
    --good-soft: #142b1e;
    --warn: #d9a84f;
    --warn-soft: #2e2410;
    --crit: #e2725a;
    --crit-soft: #331611;
    --crit-strong: #f19277;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px -12px rgba(0, 0, 0, 0.5);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 28px 20px 56px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .tab { font-variant-numeric: tabular-nums; }

  /* header */
  header.top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 6px;
  }
  h1 {
    margin: 0;
    font-size: clamp(22px, 3.4vw, 30px);
    font-weight: 900;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .top-meta {
    text-align: right;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  .top-meta .live-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--good);
    margin-right: 6px;
    box-shadow: 0 0 0 3px var(--good-soft);
  }
  .top-meta .live-dot.stale { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .top-meta .live-dot.err { background: var(--crit); box-shadow: 0 0 0 3px var(--crit-soft); }

  section { margin-bottom: 30px; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .section-sub {
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* KPI row */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .kpi {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .kpi-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .kpi-main {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .kpi-value {
    font-family: "IBM Plex Mono", monospace;
    font-size: 34px;
    font-weight: 600;
    line-height: 1;
  }
  .kpi-unit { font-size: 13px; color: var(--ink-soft); }
  .delta-pill {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .delta-up { background: var(--crit-soft); color: var(--crit-strong); }
  .delta-down { background: var(--good-soft); color: var(--good); }
  .delta-flat { background: var(--surface-sunken); color: var(--ink-soft); }
  .kpi-bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 30px;
  }
  .kpi-bars .bar {
    flex: 1;
    background: var(--accent-soft);
    border-radius: 3px 3px 0 0;
    position: relative;
  }
  .kpi-bars .bar.now { background: var(--accent); }
  .kpi-bars .bar-label {
    position: absolute;
    bottom: -17px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 9.5px;
    color: var(--ink-soft);
    font-family: "IBM Plex Mono", monospace;
  }
  .kpi-foot {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 14px;
  }

  /* two-column body */
  .grid2 {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 16px;
    align-items: start;
  }
  .panel {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 16px 18px 18px;
  }

  /* exception structure bars */
  .exc-row {
    display: grid;
    grid-template-columns: 92px 1fr 64px 54px;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .exc-row:last-child { border-bottom: none; }
  .exc-name { font-size: 12.5px; font-weight: 600; }
  .exc-track {
    height: 9px;
    background: var(--surface-sunken);
    border-radius: 5px;
    overflow: hidden;
  }
  .exc-fill { height: 100%; border-radius: 5px 0 0 5px; }
  .exc-fill.crit { background: var(--crit); }
  .exc-fill.warn { background: var(--warn); }
  .exc-fill.acc { background: var(--accent); }
  .exc-fill.mut { background: var(--ink-soft); }
  .exc-val {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13.5px;
    font-weight: 600;
    text-align: right;
  }

  /* region table */
  table.regions {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  table.regions th {
    text-align: left;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 0 8px 8px 0;
    border-bottom: 1px solid var(--border);
  }
  table.regions td {
    padding: 8px 8px 8px 0;
    border-bottom: 1px solid var(--border-soft);
    vertical-align: middle;
  }
  table.regions tr:last-child td { border-bottom: none; }
  table.regions td.num, table.regions th.num { text-align: right; font-family: "IBM Plex Mono", monospace; }
  .rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    background: var(--surface-sunken);
    color: var(--ink-soft);
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 700;
    margin-right: 8px;
  }
  .rank.top { background: var(--accent-soft); color: var(--accent-ink); }
  .minibar-track {
    height: 6px;
    width: 100%;
    background: var(--surface-sunken);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 4px;
  }
  .minibar-fill { height: 100%; background: var(--accent); border-radius: 3px; }

  /* action list */
  .action-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .action-item:last-child { border-bottom: none; }
  .sev-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-top: 4px;
    flex-shrink: 0;
  }
  .sev-dot.crit { background: var(--crit); box-shadow: 0 0 0 3px var(--crit-soft); }
  .sev-dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .action-text { font-size: 12.5px; line-height: 1.5; flex: 1; }
  .action-text b { font-weight: 700; }
  .action-num {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 700;
    font-size: 15px;
  }
  .action-note { color: var(--ink-soft); font-size: 11.5px; margin-top: 2px; }

  .net-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-top: 14px;
  }
  .net-banner .label { font-size: 12.5px; color: var(--accent-ink); font-weight: 600; }
  .net-banner .value {
    font-family: "IBM Plex Mono", monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent-ink);
  }

  /* 逐单新增/解决拆分 (2026-09-14 added) -- two boxes reusing .net-banner's
     visual language, shown only when order_diff data is available. */
  .diff-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 10px;
  }
  .diff-row[hidden] { display: none; }
  .diff-row .net-banner { margin-top: 0; }

  footer.links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--ink-soft);
  }
  footer.links span.tag {
    font-family: "IBM Plex Mono", monospace;
    color: var(--ink);
    font-weight: 600;
  }
  .note-box {
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    background: var(--surface-sunken);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .warn-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--warn-soft);
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .center-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  /* ⑥ 分区域周趋势 */
  .trend-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    margin-bottom: 10px;
  }
  .trend-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .trend-legend-swatch { flex-shrink: 0; }
  .trend-chart-wrap {
    position: relative;
    width: 100%;
  }
  .trend-svg {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }
  .trend-axis-label {
    fill: var(--ink-soft);
    font-family: "IBM Plex Mono", monospace;
    font-size: 9px;
  }
  .trend-tooltip {
    position: absolute;
    z-index: 5;
    min-width: 150px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 8px 10px;
    font-size: 11.5px;
    pointer-events: none;
  }
  .trend-tt-head {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .trend-tt-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
    white-space: nowrap;
  }
  .trend-tt-name { flex: 1; color: var(--ink-soft); }
  .trend-tt-val {
    font-weight: 600;
    color: var(--ink);
  }
  .trend-table-toggle {
    margin-top: 10px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11.5px;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
  }
  .trend-table-toggle:hover { background: var(--surface-sunken); color: var(--ink); }
  #trendTableWrap { margin-top: 12px; overflow-x: auto; }

  /* ④ 近一周日度走势：3 个小卡片（5D/7D/14D+ 各一张），每张独立 y 轴 ——
     三个桶的量级差太多（14D+ 常年是 5D 的 20-30 倍），共用一条 y 轴会导致
     5D/7D 的线看起来是条死直线，所以做成小倍数图（small multiples）而不是
     一张三线共轴的图。 */
  .daily-trend-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .daily-trend-card {
    background: var(--surface-sunken);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px 12px;
  }
  .daily-trend-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .daily-trend-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .daily-trend-svg { display: block; width: 100%; height: auto; }
  .daily-trend-foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .daily-trend-foot .val {
    font-family: "IBM Plex Mono", monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
  }

  @media (max-width: 760px) {
    .kpi-row { grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; }
    .diff-row { grid-template-columns: 1fr; }
    .exc-row { grid-template-columns: 78px 1fr 46px 40px; }
    .daily-trend-row { grid-template-columns: 1fr; }
    header.top { align-items: flex-start; }
    .top-meta { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">SwiftX · TikTok GS 物流监控</p>
      <h1>CD 交接后时效监控台</h1>
    </div>
    <div class="top-meta" id="metaBox">
      <div><span class="live-dot" id="liveDot"></span><span id="genTime">连接中…</span></div>
      <div>渠道：TikTok GS · 口径：CD交接后分段（5 / 7 / 14 天·FD关单）</div>
    </div>
  </header>

  <div id="staleWarning" hidden></div>

  <div id="loadingState" class="center-state">正在连接实时数据…</div>

  <div id="mainContent" hidden>
    <section>
      <div class="section-head">
        <span class="section-title">① 整体情况 — 未覆盖运单量</span>
        <span class="section-sub">较昨日同一分桶</span>
      </div>
      <div class="kpi-row" id="kpiRow"></div>
    </section>

    <section>
      <div class="section-head">
        <span class="section-title">② 今日重点处理</span>
        <span class="section-sub">14D+ / FD 桶内具体异常原因</span>
      </div>
      <div class="panel">
        <div id="actionRows"></div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <span class="section-title">③ 较昨日变化</span>
        <span class="section-sub" id="diffSectionSub">净变化，未拆分新增/解决</span>
      </div>
      <div class="net-banner">
        <span class="label">14D+ 未覆盖总量净变化</span>
        <span class="value" id="netValue">—</span>
      </div>
      <div class="diff-row" id="diffRow" hidden>
        <div class="net-banner">
          <span class="label">新增未覆盖（今天有/上次没有）</span>
          <span class="value" id="addedValue" style="color:var(--crit-strong)">—</span>
        </div>
        <div class="net-banner">
          <span class="label">已解决（上次有/今天没有）</span>
          <span class="value" id="resolvedValue" style="color:var(--good)">—</span>
        </div>
      </div>
      <p class="note-box" id="diffNoteBox"></p>
    </section>

    <section>
      <div class="section-head">
        <span class="section-title">④ 近一周日度走势（5D / 7D / 14D+ 总量）</span>
        <span class="section-sub" id="dailyTrendSub"></span>
      </div>
      <div class="panel">
        <div class="daily-trend-row" id="dailyTrendRow"></div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <span class="section-title">⑤ 分区域周趋势（14D+ / FD关单桶）</span>
        <span class="section-sub" id="trendSub"></span>
      </div>
      <div class="panel">
        <div class="trend-legend" id="trendLegend"></div>
        <div class="trend-chart-wrap" id="trendChartWrap">
          <svg class="trend-svg" id="trendSvg" role="img" aria-label="分区域未覆盖量周趋势"></svg>
          <div class="trend-tooltip" id="trendTooltip" hidden></div>
        </div>
        <button type="button" class="trend-table-toggle" id="trendTableToggle">查看数据表</button>
        <div id="trendTableWrap" hidden>
          <table class="regions" id="trendTable"></table>
        </div>
        <p class="note-box" id="trendNote"></p>
      </div>
    </section>
  </div>
</div>

<script>
  // Supabase 项目信息 —— URL 和 publishable key 都是设计成可以公开出现在
  // 前端代码里的（不是密钥），真正的写权限由 Supabase 的 Row Level Security
  // 策略控制：这个 key 只能 SELECT，不能 INSERT/UPDATE/DELETE。
  const SUPABASE_URL = 'https://uqunfoxhrxwdeqmsoqro.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_vmCSLk6nIClGdiHcKx34hw_HjTOFSE6';
  const POLL_INTERVAL_MS = 5 * 60 * 1000; // 5 分钟自动轮询一次，数据本身是按天更新的，不需要更频繁

  function deltaPill(delta) {
    if (delta === null || delta === undefined) return '<span class="delta-pill delta-flat">无昨日数据</span>';
    if (delta > 0) return `<span class="delta-pill delta-up">↑ ${delta}</span>`;
    if (delta < 0) return `<span class="delta-pill delta-down">↓ ${Math.abs(delta)}</span>`;
    return `<span class="delta-pill delta-flat">→ 0</span>`;
  }
  function fmt(n) { return (n || 0).toLocaleString('en-US'); }
  // 率值口径（2026-09-11 跟 Eve 在群里确认）：CD交接量（denom）做分母，
  // 超过对应天数未妥投的量（total）占比 CD交接量。
  function rate(bucket) { return bucket.denom ? bucket.total / bucket.denom : null; }
  function fmtPct(r) { return r === null || r === undefined ? 'N/A' : (r * 100).toFixed(2) + '%'; }
  function deltaPillPct(deltaPp) {
    if (deltaPp === null || deltaPp === undefined) return '<span class="delta-pill delta-flat">无昨日数据</span>';
    const rounded = Math.round(deltaPp * 100) / 100;
    if (rounded > 0) return `<span class="delta-pill delta-up">↑ ${rounded}pp</span>`;
    if (rounded < 0) return `<span class="delta-pill delta-down">↓ ${Math.abs(rounded)}pp</span>`;
    return `<span class="delta-pill delta-flat">→ 0pp</span>`;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function showState(msg, isError) {
    const el = document.getElementById('loadingState');
    el.hidden = false;
    el.textContent = msg;
    if (isError) el.style.color = 'var(--crit)';
    document.getElementById('mainContent').hidden = true;
  }

  // ⑤ 分区域周趋势 —— 5 槽分类色板（见文件头部 :root 里的 --series-1..5，
  // 已用 dataviz skill 的 validate_palette.js 校验过，浅色模式 3 个槽位对比度
  // 落在 <3:1 的 WARN 区间，靠图例文字 + 数据表视图兜底，图上不会只靠颜色本身）。
  const TREND_COLOR_VARS = ['--series-1', '--series-2', '--series-3', '--series-4', '--series-5'];

  function shortRegionName(region) {
    return region.replace('区域', '').replace('其他/未分类仓', '其他');
  }

  function mondayOf(dateStr) {
    // dateStr: "YYYY-MM-DD"，当纯日历日期处理，不做时区换算（跟页面其它
    // 地方处理 date 字段的方式一致）。
    const d = new Date(dateStr + 'T00:00:00');
    const day = d.getDay(); // 0=周日..6=周六
    d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
  }
  function weekLabel(mondayStr) {
    const parts = mondayStr.split('-');
    return `${parts[1]}/${parts[2]} 周`;
  }
  function niceCeil(v) {
    if (v <= 0) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(v)));
    const norm = v / mag;
    const niceNorm = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return niceNorm * mag;
  }

  function buildWeeklyRegionTrend(sortedDocs, regionNames) {
    // 每周取该周内"14"桶最后一天的快照值（未覆盖量是"当前积压"，不是流量，
    // 求和/平均没有意义，取周末快照才对）。region 集合是调用方传进来的固定
    // Top N（今天的排名），不会每周重新按当周排名挑选——避免同一个区域因为
    // 排名浮动而在图上换颜色（"颜色跟着实体走，不跟着排名走"）。
    const byWeek = new Map();
    sortedDocs.forEach(doc => {
      const t14 = doc.buckets && doc.buckets["14"];
      if (!t14) return;
      const wk = mondayOf(doc.date);
      const prev = byWeek.get(wk);
      if (!prev || doc.date > prev.date) {
        byWeek.set(wk, { date: doc.date, regions: t14.regions || {} });
      }
    });
    return Array.from(byWeek.keys()).sort().map(wk => {
      const entry = byWeek.get(wk);
      const values = {};
      regionNames.forEach(r => { values[r] = entry.regions[r] || 0; });
      return { week: wk, asOf: entry.date, values };
    });
  }

  // ④ 近一周日度走势：5D/7D/14D+ 三个桶各画一张小图，独立 y 轴（三个桶量级
  // 差太多，共用一条轴会让 5D/7D 看起来是条死直线——见上面 CSS 里
  // .daily-trend-row 的注释）。跟⑤周趋势图不一样，这里不按周聚合，直接用
  // 每天的真实快照点（最多取最近 7 个已同步的日期，不足 7 天就有几天画几天，
  // 不补假数据）。
  const DAILY_TREND_BUCKETS = [
    { key: '5', label: '5D 未覆盖', colorVar: '--series-1' },
    { key: '7', label: '7D 未覆盖', colorVar: '--series-2' },
    { key: '14', label: '14D+ · FD关单 未覆盖', colorVar: '--series-3' },
  ];

  function renderDailyTrend(sortedDocs) {
    const sub = document.getElementById('dailyTrendSub');
    const row = document.getElementById('dailyTrendRow');
    const days = sortedDocs.slice(-7);
    sub.textContent = days.length > 1
      ? `最近 ${days.length} 天（${days[0].date} 至 ${days[days.length - 1].date}）`
      : '数据还太少，等再攒几天';
    row.innerHTML = '';
    if (days.length === 0) return;

    const W = 260, H = 108, padL = 38, padR = 8, padT = 10, padB = 18;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const n = days.length;
    const xAt = i => (n <= 1 ? padL + plotW / 2 : padL + (plotW * i) / (n - 1));

    DAILY_TREND_BUCKETS.forEach(spec => {
      const values = days.map(d => {
        const b = d.buckets && d.buckets[spec.key];
        return b ? b.total : null;
      });
      const known = values.filter(v => v !== null && v !== undefined);
      const last = values[values.length - 1];
      const first = values.find(v => v !== null && v !== undefined);
      const hasDelta = last !== null && last !== undefined && first !== undefined && first !== null && values.length > 1;
      const delta = hasDelta ? last - first : null;

      // y 轴缩放到这几天的实际取值范围，不强制从 0 起画——这组小图要看的是
      // "这几天有没有波动"，不是比较三个桶谁的绝对量更大（下面已经有具体
      // 数字了）。14D+ 常年基数上万，真实的几百票波动如果按 0 起的轴画，会
      // 被压成一条看不出变化的死直线，反而看不出趋势，所以在图上明确标出
      // 当前的 y 轴范围（上下两条刻度线 + 数字），波动幅度多大一目了然。
      let yMin = known.length ? Math.min(...known) : 0;
      let yMax = known.length ? Math.max(...known) : 1;
      if (yMin === yMax) {
        const pad = Math.max(1, Math.round(Math.abs(yMin) * 0.05) || 1);
        yMin -= pad; yMax += pad;
      } else {
        const pad = (yMax - yMin) * 0.18;
        yMin -= pad; yMax += pad;
      }
      const yAt = v => padT + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

      let gridSvg = '';
      [yMax, yMin].forEach(v => {
        const y = yAt(v);
        gridSvg += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--border-soft)" stroke-width="1"/>`;
        gridSvg += `<text x="${padL - 6}" y="${y + 3}" text-anchor="end" class="trend-axis-label">${fmt(Math.round(v))}</text>`;
      });

      let xLabelsSvg = '';
      const labelEvery = Math.max(1, Math.ceil(n / 4));
      days.forEach((d, i) => {
        if (i % labelEvery !== 0 && i !== n - 1) return;
        const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
        const shortDate = (d.date || '').slice(5).replace('-', '/');
        xLabelsSvg += `<text x="${xAt(i)}" y="${H - 4}" text-anchor="${anchor}" class="trend-axis-label">${shortDate}</text>`;
      });

      let marksSvg = '';
      if (n > 1) {
        const pts = values.map((v, i) => (v === null || v === undefined ? null : `${xAt(i)},${yAt(v)}`)).filter(Boolean).join(' ');
        if (pts) {
          marksSvg += `<polyline points="${pts}" fill="none" stroke="var(${spec.colorVar})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        }
      }
      values.forEach((v, i) => {
        if (v === null || v === undefined) return;
        marksSvg += `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="3" fill="var(${spec.colorVar})" stroke="var(--surface-raised)" stroke-width="1.5"><title>${days[i].date}: ${fmt(v)} 票</title></circle>`;
      });

      const card = document.createElement('div');
      card.className = 'daily-trend-card';
      card.innerHTML = `
        <div class="daily-trend-head">
          <span class="daily-trend-label">${escapeHtml(spec.label)}</span>
        </div>
        <svg class="daily-trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(spec.label)}近${n}日走势">${gridSvg}${xLabelsSvg}${marksSvg}</svg>
        <div class="daily-trend-foot">
          <span class="val tab">${last === null || last === undefined ? '—' : fmt(last)} 票</span>
          ${delta === null ? '<span class="delta-pill delta-flat">数据不足</span>' : deltaPill(delta)}
        </div>
      `;
      row.appendChild(card);
    });
  }

  function renderTrendTable(weeklySeries, regionNames) {
    const table = document.getElementById('trendTable');
    table.innerHTML = '';
    const thead = document.createElement('thead');
    const headTr = document.createElement('tr');
    const thWeek = document.createElement('th');
    thWeek.textContent = '周（周一起，截至该周最后一天）';
    headTr.appendChild(thWeek);
    regionNames.forEach(region => {
      const th = document.createElement('th');
      th.className = 'num';
      th.textContent = shortRegionName(region); // 区域名来自数据库，走 textContent
      headTr.appendChild(th);
    });
    thead.appendChild(headTr);
    const tbody = document.createElement('tbody');
    weeklySeries.forEach(w => {
      const tr = document.createElement('tr');
      const tdWeek = document.createElement('td');
      tdWeek.textContent = `${weekLabel(w.week)}（${w.asOf}）`;
      tr.appendChild(tdWeek);
      regionNames.forEach(region => {
        const td = document.createElement('td');
        td.className = 'num tab';
        td.textContent = fmt(w.values[region] || 0);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(thead);
    table.appendChild(tbody);
  }

  function renderTrendChart(weeklySeries, regionNames) {
    const wrap = document.getElementById('trendChartWrap');
    const svg = document.getElementById('trendSvg');
    const legend = document.getElementById('trendLegend');
    const sub = document.getElementById('trendSub');
    const note = document.getElementById('trendNote');
    const tooltip = document.getElementById('trendTooltip');

    sub.textContent = `按周（周一起点）· Top ${regionNames.length} 区域（按今天未覆盖票数排序）`;

    if (regionNames.length === 0 || weeklySeries.length === 0) {
      svg.innerHTML = '';
      legend.innerHTML = '';
      tooltip.hidden = true;
      note.textContent = '暂无足够数据绘制趋势——等区域明细快照积累后这里会自动显示。';
      return;
    }

    const W = 760, H = 220, padL = 46, padR = 16, padT = 12, padB = 26;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const n = weeklySeries.length;
    const xAt = i => (n <= 1 ? padL + plotW / 2 : padL + (plotW * i) / (n - 1));
    const maxVal = Math.max(1, ...weeklySeries.flatMap(w => regionNames.map(r => w.values[r] || 0)));
    const niceMax = niceCeil(maxVal);
    const yAt = v => padT + plotH - (v / niceMax) * plotH;

    let gridSvg = '';
    const tickCount = 4;
    for (let t = 0; t <= tickCount; t++) {
      const v = Math.round((niceMax * t) / tickCount);
      const y = yAt(v);
      gridSvg += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--border-soft)" stroke-width="1"/>`;
      gridSvg += `<text x="${padL - 8}" y="${y + 3}" text-anchor="end" class="trend-axis-label">${fmt(v)}</text>`;
    }
    gridSvg += `<line x1="${padL}" y1="${padT + plotH}" x2="${W - padR}" y2="${padT + plotH}" stroke="var(--border)" stroke-width="1"/>`;

    let xLabelsSvg = '';
    const labelEvery = Math.max(1, Math.ceil(n / 6));
    weeklySeries.forEach((w, i) => {
      if (i % labelEvery !== 0 && i !== n - 1) return;
      // 首尾两个标签贴边锚定（start/end），避免 text-anchor=middle 在
      // viewBox 边缘被裁掉一半文字；中间标签居中对齐。
      const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
      xLabelsSvg += `<text x="${xAt(i)}" y="${H - 8}" text-anchor="${anchor}" class="trend-axis-label">${weekLabel(w.week)}</text>`;
    });

    let marksSvg = '';
    regionNames.forEach((region, idx) => {
      const colorVar = `var(${TREND_COLOR_VARS[idx % TREND_COLOR_VARS.length]})`;
      if (n > 1) {
        const pts = weeklySeries.map((w, i) => `${xAt(i)},${yAt(w.values[region] || 0)}`).join(' ');
        marksSvg += `<polyline points="${pts}" fill="none" stroke="${colorVar}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      weeklySeries.forEach((w, i) => {
        marksSvg += `<circle cx="${xAt(i)}" cy="${yAt(w.values[region] || 0)}" r="4" fill="${colorVar}" stroke="var(--surface-raised)" stroke-width="2"/>`;
      });
    });

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.innerHTML = gridSvg + xLabelsSvg + marksSvg +
      `<line id="trendCrosshair" x1="0" y1="${padT}" x2="0" y2="${padT + plotH}" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>` +
      `<rect id="trendHitLayer" x="${padL}" y="${padT}" width="${Math.max(plotW, 1)}" height="${plotH}" fill="transparent"/>`;

    // 图例（line-key 用短线段而不是色块，跟折线图的画法对应——dataviz skill：
    // "legends mirror the mark: rect for bars/areas, line for lines"）
    legend.innerHTML = '';
    regionNames.forEach((region, idx) => {
      const item = document.createElement('span');
      item.className = 'trend-legend-item';
      item.innerHTML = `<svg class="trend-legend-swatch" width="16" height="8" viewBox="0 0 16 8" aria-hidden="true"><line x1="0" y1="4" x2="16" y2="4" stroke="var(${TREND_COLOR_VARS[idx % TREND_COLOR_VARS.length]})" stroke-width="2" stroke-linecap="round"/></svg>`;
      const label = document.createElement('span');
      label.textContent = shortRegionName(region); // textContent，不拼 innerHTML
      item.appendChild(label);
      legend.appendChild(item);
    });

    const hitLayer = document.getElementById('trendHitLayer');
    const crosshair = document.getElementById('trendCrosshair');

    function nearestIndex(clientX) {
      const rect = svg.getBoundingClientRect();
      const svgX = ((clientX - rect.left) / rect.width) * W;
      let best = 0, bestDist = Infinity;
      weeklySeries.forEach((w, i) => {
        const dist = Math.abs(xAt(i) - svgX);
        if (dist < bestDist) { bestDist = dist; best = i; }
      });
      return best;
    }
    function showTooltip(i, clientX, clientY) {
      const w = weeklySeries[i];
      crosshair.setAttribute('x1', xAt(i));
      crosshair.setAttribute('x2', xAt(i));
      crosshair.setAttribute('opacity', '1');
      tooltip.innerHTML = '';
      const head = document.createElement('div');
      head.className = 'trend-tt-head';
      head.textContent = `${weekLabel(w.week)}（截至 ${w.asOf}）`;
      tooltip.appendChild(head);
      regionNames.forEach((region, idx) => {
        const row = document.createElement('div');
        row.className = 'trend-tt-row';
        row.innerHTML = `<svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true"><line x1="0" y1="4" x2="12" y2="4" stroke="var(${TREND_COLOR_VARS[idx % TREND_COLOR_VARS.length]})" stroke-width="2"/></svg>`;
        const name = document.createElement('span');
        name.className = 'trend-tt-name';
        name.textContent = shortRegionName(region);
        const val = document.createElement('span');
        val.className = 'trend-tt-val tab';
        val.textContent = fmt(w.values[region] || 0);
        row.appendChild(name);
        row.appendChild(val);
        tooltip.appendChild(row);
      });
      tooltip.hidden = false;
      const wrapRect = wrap.getBoundingClientRect();
      let left = clientX - wrapRect.left + 12;
      const top = clientY - wrapRect.top - 12;
      if (left + 190 > wrapRect.width) left = clientX - wrapRect.left - 190 - 12;
      tooltip.style.left = Math.max(0, left) + 'px';
      tooltip.style.top = Math.max(0, top) + 'px';
    }
    function hideTooltip() {
      crosshair.setAttribute('opacity', '0');
      tooltip.hidden = true;
    }
    hitLayer.addEventListener('pointermove', e => showTooltip(nearestIndex(e.clientX), e.clientX, e.clientY));
    hitLayer.addEventListener('pointerleave', hideTooltip);
    hitLayer.addEventListener('pointerdown', e => showTooltip(nearestIndex(e.clientX), e.clientX, e.clientY));

    note.innerHTML = '';
    note.appendChild(document.createElement('b')).textContent = '怎么读这张图：';
    note.appendChild(document.createTextNode(
      `每周取该周内最后一天的"14D+ / FD关单"快照（未覆盖量是当前积压存量，不是流量，所以不做求和/平均），区域集合固定用今天未覆盖票数最高的 Top ${regionNames.length}（不随每周排名重新洗牌，颜色不会跳来跳去）。`
    ));

    renderTrendTable(weeklySeries, regionNames);
  }

  function render(historyDocs) {
    const sorted = historyDocs.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    if (sorted.length === 0) {
      showState('还没有同步过任何数据 — 等待第一次自动同步完成后这里会自动显示');
      return;
    }
    const today = sorted[sorted.length - 1];
    const yday = sorted.length > 1 ? sorted[sorted.length - 2] : null;

    document.getElementById('loadingState').hidden = true;
    document.getElementById('mainContent').hidden = false;

    // header meta + staleness check
    const genLabel = today.generated_at_local ? today.generated_at_local.replace('T', ' ').slice(0, 16) : today.date;
    document.getElementById('genTime').textContent = '生成于 ' + genLabel + '（America/Los_Angeles）';
    const dot = document.getElementById('liveDot');
    const warnBox = document.getElementById('staleWarning');
    let ageHours = null;
    try {
      const ts = today.generated_at_local ? new Date(today.generated_at_local) : new Date(today.date + 'T12:00:00-07:00');
      ageHours = (Date.now() - ts.getTime()) / 3600000;
    } catch (e) {}
    if (ageHours !== null && ageHours > 36) {
      dot.className = 'live-dot stale';
      warnBox.hidden = false;
      warnBox.className = 'warn-banner';
      warnBox.textContent = `⚠️ 最新数据是 ${Math.round(ageHours / 24 * 10) / 10} 天前同步的，看起来每日自动同步可能没有正常运行——下面的数字不一定是今天的实际情况。`;
    } else {
      dot.className = 'live-dot';
      warnBox.hidden = true;
    }

    // ① KPI row
    const kpiLabels = { "5": "5D", "7": "7D", "14": "14D+ · FD关单" };
    const kpiRow = document.getElementById('kpiRow');
    kpiRow.innerHTML = '';
    ["5", "7", "14"].forEach(key => {
      const bucketToday = today.buckets[key];
      if (!bucketToday) return;
      const bucketYday = yday ? yday.buckets[key] : null;
      const cur = bucketToday.total;
      const prev = bucketYday ? bucketYday.total : null;
      const delta = prev !== null ? cur - prev : null;
      const maxVal = Math.max(cur, prev || 0) || 1;
      const curRate = rate(bucketToday);
      const prevRate = bucketYday ? rate(bucketYday) : null;
      const rateDeltaPp = (curRate !== null && prevRate !== null) ? (curRate - prevRate) * 100 : null;
      const el = document.createElement('div');
      el.className = 'kpi';
      el.innerHTML = `
        <div class="kpi-label">${kpiLabels[key]} 未覆盖运单</div>
        <div class="kpi-main">
          <span class="kpi-value tab">${fmt(cur)}</span>
          <span class="kpi-unit">票</span>
          ${deltaPill(delta)}
        </div>
        <div class="kpi-main" style="gap:8px">
          <span class="tab" style="font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--accent-ink)">率值 ${fmtPct(curRate)}</span>
          ${deltaPillPct(rateDeltaPp)}
        </div>
        <div class="kpi-bars">
          ${prev !== null ? `<div class="bar" style="height:${Math.max(6, prev / maxVal * 30)}px"><span class="bar-label">昨日</span></div>` : ''}
          <div class="bar now" style="height:${Math.max(6, cur / maxVal * 30)}px"><span class="bar-label">今日</span></div>
        </div>
        <div class="kpi-foot">${key === "14" ? "含全部历史积压（无更早节点）" : `到达目的中心时间处于 ${key} 天监控窗口内`} · 率值=未覆盖量/CD交接量</div>
      `;
      kpiRow.appendChild(el);
    });

    // t14/y14: 今天/昨天的 14D+/FD关单桶快照 —— 今日重点处理、较昨日变化、
    // 分区域周趋势都要用。
    const t14 = today.buckets["14"] || { exceptionByGroup: {}, exceptionByCode: {}, regions: {} };
    const y14 = yday ? (yday.buckets["14"] || null) : null;

    // Top 5 区域（按14D+/FD未覆盖票数排序）—— 只喂给下面的周趋势图（2026-09-17
    // 应 Tim 要求，把"核心异常结构"和"重点区域 Top5"这两个独立模块去掉了，
    // 跟其它面板信息有重复；这份区域排序数据本身还留着，周趋势图要用）。
    const regionEntries = Object.entries(t14.regions || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);

    // ④ 近一周日度走势：5D/7D/14D+ 各桶按天的真实快照（最多取最近 7 天）
    renderDailyTrend(sorted);

    // ⑤ 分区域周趋势：固定用上面这批 Top N 区域名单（不按每周重新排名）
    const trendRegionNames = regionEntries.map(([region]) => region);
    renderTrendChart(buildWeeklyRegionTrend(sorted, trendRegionNames), trendRegionNames);

    // ② action list: 长时间未找到 (ERWHS010+ERHUB009), 疑似丢失 (ERWHS006)
    const ebc = t14.exceptionByCode || {};
    const yebc = y14 ? (y14.exceptionByCode || {}) : {};
    const longMissing = (ebc["ERWHS010"] || 0) + (ebc["ERHUB009"] || 0);
    const yLongMissing = y14 ? (yebc["ERWHS010"] || 0) + (yebc["ERHUB009"] || 0) : null;
    const suspectedLost = ebc["ERWHS006"] || 0;
    const ySuspectedLost = y14 ? (yebc["ERWHS006"] || 0) : null;
    const actionRows = document.getElementById('actionRows');
    actionRows.innerHTML = `
      <div class="action-item">
        <span class="sev-dot crit"></span>
        <div class="action-text">
          <b>长时间未找到</b>（ERWHS010 仓内 + ERHUB009 HUB中转合计）
          <div class="action-note">最需要人工排查的一类——长期卡在仓内/HUB分拣环节找不到</div>
        </div>
        <div style="text-align:right">
          <div class="action-num tab">${fmt(longMissing)}</div>
          <div style="margin-top:4px">${deltaPill(yLongMissing !== null ? longMissing - yLongMissing : null)}</div>
        </div>
      </div>
      <div class="action-item">
        <span class="sev-dot warn"></span>
        <div class="action-text">
          <b>仓库内疑似丢失</b>（ERWHS006）
          <div class="action-note">在仓内环节被标记疑似丢失，尚未走到"长时间未找到"分类</div>
        </div>
        <div style="text-align:right">
          <div class="action-num tab">${fmt(suspectedLost)}</div>
          <div style="margin-top:4px">${deltaPill(ySuspectedLost !== null ? suspectedLost - ySuspectedLost : null)}</div>
        </div>
      </div>
    `;

    // ③ net change banner
    const netEl = document.getElementById('netValue');
    if (y14) {
      const net = t14.total - y14.total;
      netEl.textContent = (net > 0 ? '↑ +' : net < 0 ? '↓ ' : '→ ') + fmt(net) + ' 票';
      netEl.style.color = net > 0 ? 'var(--crit-strong)' : net < 0 ? 'var(--good)' : 'var(--accent-ink)';
    } else {
      netEl.textContent = '暂无昨日数据';
    }

    // ③ 逐单新增/解决拆分 (2026-09-14) -- t14.added/t14.resolved 只有在
    // Supabase 的 order_snapshots 表已经攒够两天快照时才会有值；用
    // !== undefined && !== null 判断"有没有数据"，不能用真假值判断
    // （0 是"确实没有新增/解决"，是有效数据，不是"没数据"）。
    const diffRow = document.getElementById('diffRow');
    const diffSectionSub = document.getElementById('diffSectionSub');
    const diffNoteBox = document.getElementById('diffNoteBox');
    const hasDiff = t14.added !== undefined && t14.added !== null
      && t14.resolved !== undefined && t14.resolved !== null;
    if (hasDiff) {
      document.getElementById('addedValue').textContent = '+' + fmt(t14.added) + ' 单';
      document.getElementById('resolvedValue').textContent = '+' + fmt(t14.resolved) + ' 单';
      diffRow.hidden = false;
      diffSectionSub.textContent = '逐单（按运单号）对比，已拆分新增/解决';
      diffNoteBox.textContent = '新增 = 今天在"未覆盖"名单里、上次快照没有的运单；解决 = 上次快照里有、今天不在了的运单（可能是妥投，也可能是丢失/核销后关单退出统计口径，这里不区分）。上面的净变化 ≈ 新增 − 解决，两边统计时点略有差异，允许有极小误差。';
    } else {
      diffRow.hidden = true;
      diffSectionSub.textContent = '净变化，未拆分新增/解决';
      diffNoteBox.textContent = '暂时还没有逐单新增/解决数据（可能是刚开始跑、还没攒够两天快照，或者这次同步跳过了明细拉取）——这里的环比是"今天总量 − 昨天总量"的净变化，不是"新增了多少 / 解决了多少"的拆分。';
    }
  }

  async function loadData() {
    try {
      const resp = await fetch(
        SUPABASE_URL + '/rest/v1/history?select=date,generated_at_local,buckets&order=date.asc',
        { headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: 'Bearer ' + SUPABASE_PUBLISHABLE_KEY } }
      );
      if (!resp.ok) {
        showState('读取数据失败（HTTP ' + resp.status + '）', true);
        return;
      }
      const rows = await resp.json();
      // buckets 存的是数据库字段名 generated_at_local，页面渲染逻辑里统一用这个字段名
      render(rows);
    } catch (e) {
      showState('初始化失败：' + String(e), true);
    }
  }

  document.getElementById('trendTableToggle').addEventListener('click', () => {
    const wrap = document.getElementById('trendTableWrap');
    wrap.hidden = !wrap.hidden;
    document.getElementById('trendTableToggle').textContent = wrap.hidden ? '查看数据表' : '收起数据表';
  });

  loadData();
  setInterval(loadData, POLL_INTERVAL_MS);
</script>
</body>
</html>
